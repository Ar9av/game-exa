<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iso City Builder</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f4f1ea; font-family: system-ui, -apple-system, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #c.painting { cursor: crosshair; }

  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(30,26,20,.82); color: #f4f1ea; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; display: flex; gap: 18px; align-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  #hud .stat { display: flex; flex-direction: column; align-items: flex-start; min-width: 62px; }
  #hud .stat b { font-size: 15px; }
  #hud .demand { display: flex; gap: 8px; }
  #hud .bar { width: 40px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); position: relative; overflow: hidden; }
  #hud .bar i { position: absolute; top: 0; bottom: 0; left: 50%; background: #6fd08a; }
  #hud .bar i.neg { background: #d96f6f; left: auto; right: 50%; }
  #hud .demand label { font-size: 10px; opacity: .8; display: block; margin-bottom: 2px; }

  #palette {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 6px; background: rgba(30,26,20,.82); padding: 8px; border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  #palette button {
    all: unset; cursor: pointer; color: #f4f1ea; padding: 8px 12px; border-radius: 8px;
    font-size: 12px; text-align: center; min-width: 56px; border: 1.5px solid transparent;
  }
  #palette button .ic { display: block; font-size: 18px; }
  #palette button .cost { display: block; font-size: 10px; opacity: .7; }
  #palette button.active { border-color: #ffd23e; background: rgba(255,255,255,.08); }
  #palette button:hover { background: rgba(255,255,255,.06); }

  #toast {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(180,60,60,.92); color: #fff; padding: 6px 14px; border-radius: 8px;
    font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="stat"><label style="opacity:.7">Money</label><b id="hud-money">$0</b></div>
  <div class="stat"><label style="opacity:.7">Pop</label><b id="hud-pop">0</b></div>
  <div class="stat"><label style="opacity:.7">Jobs</label><b id="hud-jobs">0</b></div>
  <div class="demand">
    <div><label>Res</label><div class="bar"><i id="d-res"></i></div></div>
    <div><label>Com</label><div class="bar"><i id="d-com"></i></div></div>
    <div><label>Ind</label><div class="bar"><i id="d-ind"></i></div></div>
  </div>
</div>

<div id="toast"></div>

<div id="palette"></div>

<script type="module" src="main.js"></script>
</body>
</html>
